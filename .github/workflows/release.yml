# Tags a release when a pull request that bumps the version is merged into main.
#
# Flow: bump `version:` in pubspec.yaml and rename "## Unreleased" in CHANGELOG.md to
# "## <version> - <date>" in the PR. On merge this job pushes the tag v<version>, and that
# tag push runs publish.yml, which publishes to pub.dev (pub.dev only accepts automated
# publishing from a tag push). A merge that doesn't change the version does nothing.
#
# The tag is pushed with the RELEASE_DEPLOY_KEY deploy key: a tag pushed with the default
# GITHUB_TOKEN would not start publish.yml.
name: Tag release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Check the version
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r"'"'"' ')
          tag="v$version"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Version '$version' isn't a plain x.y.z release; nothing to publish."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists; the version wasn't bumped, nothing to publish."
            exit 0
          fi
          if ! grep -Eq "^## $version( |$)" CHANGELOG.md; then
            echo "::error::pubspec.yaml is at $version but CHANGELOG.md has no '## $version - <date>' heading."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push the tag
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "agentic_harness ${TAG#v} (#$PR)"
          git push origin "refs/tags/$TAG"
          echo "::notice::Pushed $TAG; publish.yml publishes it to pub.dev."
