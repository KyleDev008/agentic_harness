name: agentic_harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The lowest supported SDK (pubspec `environment.sdk`) and the latest.
        sdk: ['3.7.0', stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Get dependencies
        run: dart pub get

      - name: Check formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .

      # Covers lib, test and example, so the example must compile.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

      - name: Run example (offline, scripted model)
        run: dart run example/main.dart < /dev/null

      - name: Publish dry run
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run

      # The pub.dev scorer; prints the points the package would get.
      - name: pana score
        if: matrix.sdk == 'stable'
        run: |
          dart pub global activate pana 0.23.19
          dart pub global run pana --no-warning .
